<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rice Digital Shadow 3D - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <header>
                <h1>Digital Shadow 3D</h1>
                <p class="subtitle">Rice Plant Digital Twin (Padi)</p>
            </header>
            <div class="sidebar-section">
                <h3
                    style="color: #88aaff; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; margin: 0 0 15px 0; border-bottom: 1px solid #1a222f; padding-bottom: 8px;">
                    Monitoring Sensor</h3>
                <div class="sensor-grid">
                    <div class="sensor-card">
                        <label>Kelembapan Tanah</label>
                        <span class="value" id="val-moisture">85%</span>
                        <div class="unit">Kapasitif (D32)</div>
                    </div>
                    <div class="sensor-card">
                        <label>Nutrisi (TDS)</label>
                        <span class="value" id="val-tds">600 ppm</span>
                        <div class="unit">Analog (D33)</div>
                    </div>
                    <div class="sensor-card">
                        <label>Intensitas Cahaya</label>
                        <span class="value" id="val-light">12k lux</span>
                        <div class="unit">I2C BH1750</div>
                    </div>
                    <div class="sensor-card">
                        <label>Suhu & Kel. Udara</label>
                        <span class="value" id="val-env">28°C / 65%</span>
                        <div class="unit">DHT22 Mikroklimat</div>
                    </div>
                    <div class="sensor-card">
                        <label>Suhu Air</label>
                        <span class="value" id="val-wtemp">26 °C</span>
                        <div class="unit">DS18B20 Irigasi</div>
                    </div>
                    <div class="sensor-card" style="grid-column: span 2; border: 1px solid #2a3547; background: #0c1015; margin-top: 5px;">
                        <label style="color: #a0aec0; margin-bottom: 6px;">Tanggal Tanam (Planting Date)</label>
                        <input type="date" id="input-planting-date"
                            style="width: 100%; border-radius: 4px; padding: 6px; background: #131921; color: #fff; border: 1px solid #2a3547; cursor: pointer; font-family: inherit; font-size: 0.85rem; box-sizing: border-box;">
                    </div>
                </div>
            </div>

            <div class="sidebar-section" style="margin-top: 25px;">
                <h3
                    style="color: #88aaff; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; margin: 0 0 15px 0; border-bottom: 1px solid #1a222f; padding-bottom: 8px;">
                    Simulasi Pertumbuhan</h3>

                <div class="controls">
                    <button id="btn-reset-real" class="toggle-btn"
                        style="display: none; background: #1b5e20; color: #ffffff; border: 1px solid #2e7d32; width: 100%; margin-bottom: 15px; font-weight: 600; padding: 10px; border-radius: 4px; cursor: pointer; font-family: inherit;">
                        Reset ke Data Real-Time
                    </button>
                    <div class="control-group">
                        <label>Umur Tumbuh (Hari 1-120)</label>
                        <input type="range" id="slider-age" min="1" max="120" value="60">
                    </div>
                    <div class="control-group">
                        <label>Kelembapan Tanah (%) [Wilt/Roots]</label>
                        <input type="range" id="slider-moisture" min="0" max="100" value="85">
                    </div>
                    <div class="control-group">
                        <label>Suhu Udara (°C) [Growth/Color]</label>
                        <input type="range" id="slider-atemp" min="0" max="50" value="28">
                    </div>
                    <div class="control-group">
                        <label>Kelembapan Udara (%) [Fog/Stem/Fruit]</label>
                        <input type="range" id="slider-humi" min="0" max="100" value="65">
                    </div>
                    <div class="control-group">
                        <label>Nutrisi (TDS ppm) [Chlorosis/Fruit]</label>
                        <input type="range" id="slider-tds" min="0" max="2000" value="600">
                    </div>
                    <div class="control-group">
                        <label>Cahaya (Lux) [Phototropism/Etiolation]</label>
                        <input type="range" id="slider-light" min="0" max="100000" value="12000">
                    </div>
                    <div class="control-group">
                        <label>Suhu Air (°C) [Roots]</label>
                        <input type="range" id="slider-wtemp" min="0" max="50" value="26">
                    </div>
                    <button id="toggle-soil" class="toggle-btn active">Toggle Media Tanah</button>
                    <button id="reset-cam" class="toggle-btn">Reset Sudut Pandang</button>
                </div>
            </div>
        </div>
        <div class="main-viewport">
            <div id="threejs-container"></div>
            <div class="stage-badge" id="stage-display">Loading Model...</div>
            <div class="instruction-hint">Gunakan Mouse/Sentuh untuk Putar & Zoom</div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
