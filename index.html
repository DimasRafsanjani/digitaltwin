<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rice Digital Shadow 3D - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <header>
                <h1>Digital Shadow 3D</h1>
                <p class="subtitle">Rice Plant Digital Twin (Padi)</p>
            </header>
            <div class="sensor-grid">
                <div class="sensor-card">
                    <label>Soil Moisture</label>
                    <span class="value" id="val-moisture">85%</span>
                    <div class="unit">Capacitive (D32)</div>
                </div>
                <div class="sensor-card">
                    <label>Nutrients (TDS)</label>
                    <span class="value" id="val-tds">600 ppm</span>
                    <div class="unit">Analog (D33)</div>
                </div>
                <div class="sensor-card">
                    <label>Light Intensity</label>
                    <span class="value" id="val-light">12k lux</span>
                    <div class="unit">I2C BH1750</div>
                </div>
                <div class="sensor-card">
                    <label>Air Temp & Humi</label>
                    <span class="value" id="val-env">28°C / 65%</span>
                    <div class="unit">DHT22 Mikroklimat</div>
                </div>
                <div class="sensor-card">
                    <label>Water Temp</label>
                    <span class="value" id="val-wtemp">26 °C</span>
                    <div class="unit">DS18B20 Irigasi</div>
                </div>
            </div>
            <div class="controls">
                <div class="control-group">
                    <label>Growth Duration (Day 1-120)</label>
                    <input type="range" id="slider-age" min="1" max="120" value="60">
                </div>
                <div class="control-group">
                    <label>Soil Moisture (%) [Wilt/Roots]</label>
                    <input type="range" id="slider-moisture" min="0" max="100" value="85">
                </div>
                <div class="control-group">
                    <label>Air Temp (°C) [Growth/Color]</label>
                    <input type="range" id="slider-atemp" min="0" max="50" value="28">
                </div>
                <div class="control-group">
                    <label>Air Humidity (%) [Fog/Stem/Fruit]</label>
                    <input type="range" id="slider-humi" min="0" max="100" value="65">
                </div>
                <div class="control-group">
                    <label>Nutrients (TDS ppm) [Chlorosis/Fruit]</label>
                    <input type="range" id="slider-tds" min="0" max="2000" value="600">
                </div>
                <div class="control-group">
                    <label>Light (Lux) [Phototropism/Etiolation]</label>
                    <input type="range" id="slider-light" min="0" max="100000" value="12000">
                </div>
                <div class="control-group">
                    <label>Water Temp (°C) [Roots]</label>
                    <input type="range" id="slider-wtemp" min="0" max="50" value="26">
                </div>
                <button id="toggle-roots" class="toggle-btn active">Toggle Root System</button>
                <button id="reset-cam" class="toggle-btn">Reset Perspective</button>
            </div>
            <footer>
                <p><span class="status-dot"></span> System: Shadowing Live</p>
            </footer>
        </div>
        <div class="main-viewport">
            <div id="threejs-container"></div>
            <div class="stage-badge" id="stage-display">Loading Model...</div>
            <div class="instruction-hint">Use Mouse/Touch to Rotate & Zoom</div>
        </div>
    </div>

    <script>
    // ============================================================
    //  RICE DIGITAL SHADOW 3D — GLTF Model + Sensor Mapping
    // ============================================================
    //  Uses a real rice plant 3D model (Sketchfab, CC-BY-4.0) 
    //  with sensor-driven visual transformations:
    //    - Age: scale (growth), tiller count
    //    - Moisture: leaf droop angle (wilt)
    //    - TDS: color health (chlorosis), thickness
    //    - Light: scene brightness, etiolation
    //    - Water Temp: root health color
    // ============================================================

    // --- Sensor State ---
    const S = { 
        moisture: 85, 
        tds: 600, 
        light: 12000, 
        atemp: 28, 
        humi: 65,
        wtemp: 26, 
        age: 60, 
        roots: true 
    };

    // --- THREE.JS Setup ---
    const box = document.getElementById('threejs-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0d12);
    scene.fog = new THREE.Fog(0x0a0d12, 60, 200);

    const cam = new THREE.PerspectiveCamera(45, box.clientWidth / box.clientHeight, 0.1, 500);
    cam.position.set(0, 4, 10);

    const ren = new THREE.WebGLRenderer({ antialias: true });
    ren.setSize(box.clientWidth, box.clientHeight);
    ren.setPixelRatio(window.devicePixelRatio);
    ren.shadowMap.enabled = true;
    ren.outputEncoding = THREE.sRGBEncoding;
    box.appendChild(ren.domElement);

    const ctrl = new THREE.OrbitControls(cam, ren.domElement);
    ctrl.enableDamping = true;
    ctrl.maxPolarAngle = Math.PI / 2;
    ctrl.target.set(0, 2, 0);

    // --- Lighting ---
    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    scene.add(sun);
    // A subtle fill light from below-left for depth
    const fill = new THREE.DirectionalLight(0x88aaff, 0.3);
    fill.position.set(-5, -2, 5);
    scene.add(fill);

    // --- Ground ---
    const ground = new THREE.Mesh(
        new THREE.CircleGeometry(3.5, 32),
        new THREE.MeshStandardMaterial({ 
            color: 0x17110a, 
            roughness: 0.95,
            transparent: true,
            opacity: 0.25
        })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- Root geometry (L-System, shown underground) ---
    const rootGeo = new THREE.CylinderGeometry(0.005, 0.008, 1, 4).translate(0, 0.5, 0);
    let rootGroup = new THREE.Group();
    scene.add(rootGroup);

    // --- Plant container ---
    let plantGroup = new THREE.Group();
    scene.add(plantGroup);

    // Inisiasi awal status
    console.log('Procedural L-System Rice Plant Generator Active.');
    document.getElementById('stage-display').innerText = 'Vegetative Phase';

    // --- PROCEDURAL GENERATION: LEAF L-SYSTEM ---
    function createLeaf(length, width, color, wiltAngle) {
        const leafGroup = new THREE.Group();
        let currentParent = leafGroup;
        const segments = 4;
        const segLen = length / segments;

        const leafMat = new THREE.MeshStandardMaterial({
            color: color,
            side: THREE.DoubleSide,
            roughness: 0.8,
            shadowSide: THREE.DoubleSide
        });

        for (let i = 0; i < segments; i++) {
            const currentWidth = width * (1.0 - (i / segments) * 0.8);
            const geo = new THREE.ConeGeometry(currentWidth, segLen, 4);
            geo.translate(0, segLen / 2, 0);
            geo.rotateX(-Math.PI / 2); // Arahkan ke depan (axis lokal Z)

            const mesh = new THREE.Mesh(geo, leafMat);
            mesh.scale.set(1.0, 0.06, 1.0); // Bikin pipih seperti daun rumput/padi
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            const joint = new THREE.Group();
            joint.add(mesh);

            // Bending melengkung alami + wilting
            const naturalBend = 0.15 + (i * 0.12);
            const activeWilt = (i === 0) ? wiltAngle * 0.65 : wiltAngle * 0.25;
            joint.rotation.x = naturalBend + activeWilt;

            if (i > 0) {
                joint.position.z = segLen;
            }
            currentParent.add(joint);
            currentParent = joint;
        }
        return leafGroup;
    }

    // --- PROCEDURAL GENERATION: PANICLE (Grains/Malai) ---
    function createPanicle(length, radius, S) {
        const panicleGroup = new THREE.Group();
        
        let grainCol = new THREE.Color(0x7fa255); // Bulir muda hijau
        if (S.age > 80) {
            grainCol.lerp(new THREE.Color(0xd4ab2a), THREE.MathUtils.clamp((S.age - 80) / 30, 0, 1)); // Bulir matang kuning emas
        }
        if (S.humi > 90) {
            grainCol.lerp(new THREE.Color(0x56412f), 0.4); // Pembusukan karena kelembapan tinggi
        }

        const grainMat = new THREE.MeshStandardMaterial({ color: grainCol, roughness: 0.6 });
        const stemMat = new THREE.MeshStandardMaterial({ color: 0x7fa255, roughness: 0.9 });

        const branches = 6;
        const segLen = length / branches;
        let currentParent = panicleGroup;

        for (let i = 0; i < branches; i++) {
            const geo = new THREE.CylinderGeometry(radius * (1 - i/branches), radius * (1.1 - i/branches), segLen, 4);
            geo.translate(0, segLen / 2, 0);

            const mesh = new THREE.Mesh(geo, stemMat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            const joint = new THREE.Group();
            joint.add(mesh);

            if (i > 0) {
                joint.position.y = segLen;
            }
            // Malai melengkung berat ke bawah
            joint.rotation.x = 0.25 + (i * 0.12);

            // Bulir-bulir padi
            const grainsPerSeg = 3;
            for (let g = 0; g < grainsPerSeg; g++) {
                const grainStemGeo = new THREE.CylinderGeometry(0.002, 0.004, 0.03, 3);
                grainStemGeo.translate(0, 0.015, 0);
                const gStem = new THREE.Mesh(grainStemGeo, stemMat);

                const grainGeo = new THREE.SphereGeometry(0.012, 6, 6);
                grainGeo.scale(1.0, 1.8, 1.0); // Bentuk lonjong padi
                grainGeo.translate(0, 0.03, 0);
                const gMesh = new THREE.Mesh(grainGeo, grainMat);
                gMesh.castShadow = true;
                gMesh.receiveShadow = true;

                const grainGroup = new THREE.Group();
                grainGroup.add(gStem);
                grainGroup.add(gMesh);

                grainGroup.position.y = (g / grainsPerSeg) * segLen;
                grainGroup.rotation.x = (Math.random() - 0.5) * 1.5;
                grainGroup.rotation.z = (Math.random() - 0.5) * 1.5;
                joint.add(grainGroup);
            }

            currentParent.add(joint);
            currentParent = joint;
        }
        return panicleGroup;
    }

    // --- PROCEDURAL GENERATION: STALK (Tiller/Anakan) ---
    function createTiller(height, baseRadius, color, S, sunPos, leanFactor) {
        const tillerGroup = new THREE.Group();
        
        // Jumlah ruas bertambah seiring umur
        const segments = Math.floor(THREE.MathUtils.mapLinear(S.age, 1, 60, 2, 5));
        const segLen = height / segments;

        const stalkMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.75 });
        let currentParent = tillerGroup;

        // Batang layu merunduk jika tanah kering
        const stalkWilt = S.moisture < 45 ? THREE.MathUtils.mapLinear(S.moisture, 0, 45, 0.35, 0) : 0.0;

        for (let i = 0; i < segments; i++) {
            const currentRadius = baseRadius * (1.0 - (i / segments) * 0.5);
            const geo = new THREE.CylinderGeometry(currentRadius * 0.8, currentRadius, segLen, 6);
            geo.translate(0, segLen / 2, 0);

            const mesh = new THREE.Mesh(geo, stalkMat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            const joint = new THREE.Group();
            joint.add(mesh);

            if (i > 0) {
                joint.position.y = segLen;
            }

            // Gabungan pembengkokan natural + kelayuan + phototropism (menuju matahari)
            const leanX = (sunPos.x * leanFactor) * (i / segments);
            const leanZ = (sunPos.z * leanFactor) * (i / segments);

            joint.rotation.x = (i === 0 ? 0.06 : 0.03) + stalkWilt * 0.15 + leanZ;
            joint.rotation.z = leanX;

            // Tambah Daun di setiap ruas batang
            if (i > 0 && i < segments) {
                const leafAngle = (i % 2 === 0) ? Math.PI / 4 : -Math.PI / 4;
                const leafLen = height * 0.45 * (1.0 - (i / segments) * 0.3);
                const leafWidth = currentRadius * 3.8;
                const activeWilt = S.moisture < 45 ? THREE.MathUtils.mapLinear(S.moisture, 0, 45, 1.3, 0) : 0.0;

                const leaf = createLeaf(leafLen, leafWidth, color, activeWilt);
                leaf.position.y = segLen;
                leaf.rotation.y = leafAngle + (Math.random() - 0.5) * 0.25;
                leaf.rotation.x = 0.45;

                joint.add(leaf);
            }

            currentParent.add(joint);
            currentParent = joint;
        }

        // Tambah Malai di ujung atas setelah umur 60 hari
        if (S.age > 60) {
            const panicle = createPanicle(height * 0.28, baseRadius * 0.75, S);
            panicle.position.y = segLen;
            currentParent.add(panicle);
        }

        return tillerGroup;
    }

    // --- BUILD PLANT MAIN CONTROL ---
    function buildPlant() {
        plantGroup.clear();
        rootGroup.clear();

        // Tentukan Fase Pertumbuhan
        let phase = S.age >= 90 ? "Ripening Stage" : (S.age >= 60 ? "Reproductive Phase" : "Vegetative Phase");
        document.getElementById('stage-display').innerText = phase;

        // === 1. ARAS / KECEPATAN TUMBUH (USIA & SUHU) ===
        let tempFactor = 1.0 - Math.abs(S.atemp - 27.5) / 25;
        tempFactor = THREE.MathUtils.clamp(tempFactor, 0.4, 1.0);

        // Jumlah anakan diatur oleh TDS (Nutrisi)
        let maxTillersTDS = Math.floor(THREE.MathUtils.mapLinear(S.tds, 0, 1500, 1, 10));
        maxTillersTDS = THREE.MathUtils.clamp(maxTillersTDS, 1, 12);
        
        let tillers = Math.floor(THREE.MathUtils.mapLinear(S.age * tempFactor, 1, 60, 1, maxTillersTDS));
        if (S.age > 60) tillers = Math.min(maxTillersTDS, Math.floor(maxTillersTDS * tempFactor + 2));

        // Tinggi Padi
        let growthScale = THREE.MathUtils.mapLinear(S.age * tempFactor, 1, 80, 0.15, 1.0);
        growthScale = THREE.MathUtils.clamp(growthScale, 0.15, 1.0);

        // === 2. ETIOLASI & PHOTOTROPISM (CAHAYA) ===
        let yStretch = 1.0;
        let xzStretch = 1.0;
        if (S.light < 5000) {
            yStretch = THREE.MathUtils.mapLinear(S.light, 0, 5000, 1.8, 1.0); // Meninggi (Etiolasi)
            xzStretch = THREE.MathUtils.mapLinear(S.light, 0, 5000, 0.55, 1.0); // Menipis
        }

        let sunPos = new THREE.Vector3(10, 20, 10).normalize();
        let leanFactor = THREE.MathUtils.mapLinear(S.light, 0, 50000, 0, 0.18); // Kecondongan ke arah matahari

        // === 3. KESEHATAN & KLOROSIS (TDS, MOISTURE, SUHU) ===
        let healthScore = (S.moisture / 100) * (Math.min(S.tds, 1200) / 1200) * tempFactor;
        
        const healthyGreen = new THREE.Color(0x2f642a);
        const chlorotic = new THREE.Color(0xbebe47);
        const straw = new THREE.Color(0x9a8a42);
        const burnt = new THREE.Color(0x403225);

        let plantCol = healthyGreen.clone();
        if (healthScore < 0.7) plantCol.lerp(chlorotic, 1 - (healthScore / 0.7));
        if (S.light > 80000) plantCol.lerp(burnt, (S.light - 80000) / 40000); // Terbakar cahaya berlebih
        if (S.age > 85) plantCol.lerp(straw, THREE.MathUtils.clamp((S.age - 85) / 35, 0, 1)); // Layu menguning panen

        // === 4. GENERATE RUMPUN PADI ---
        const finalHeight = growthScale * yStretch * 3.6;
        const tdsThickness = THREE.MathUtils.mapLinear(S.tds, 0, 2000, 0.55, 1.25);
        const finalRadius = 0.02 * xzStretch * tdsThickness;

        for (let t = 0; t < tillers; t++) {
            const angle = (t / tillers) * Math.PI * 2;
            const spread = 0.04 + (t * 0.03);
            const spreadRadius = (tillers === 1) ? 0 : spread;

            // Generate anakan prosedural
            const tiller = createTiller(finalHeight, finalRadius, plantCol, S, sunPos, leanFactor);
            tiller.position.set(Math.sin(angle) * spreadRadius, 0, Math.cos(angle) * spreadRadius);
            tiller.rotation.y = angle + (Math.random() - 0.5) * 0.3;

            plantGroup.add(tiller);
        }

        if (S.roots) buildRoots();
    }

    // --- ENHANCED Root System (Branching L-System) ---
    function buildRoots() {
        let rootCol = new THREE.Color(0xf5f0e1);
        if (S.wtemp > 35 || S.wtemp < 18) rootCol.set(0x4a3a2a); // Stress browning
        let mat = new THREE.MeshBasicMaterial({ color: rootCol, transparent: true, opacity: 0.6 });

        // Root density based on Water Temp and Soil Moisture
        let moistureIncentive = S.moisture < 30 ? 1.5 : 1.0;
        let rootCount = Math.floor(THREE.MathUtils.mapLinear(S.age, 1, 120, 4, 18) * moistureIncentive);
        
        // Branching factor based on Water Temp
        let branchingProb = 1.0 - Math.abs(S.wtemp - 24) / 20; 
        branchingProb = THREE.MathUtils.clamp(branchingProb, 0.1, 0.9);

        for (let i = 0; i < rootCount; i++) {
            let ang = (i / rootCount) * Math.PI * 2;
            createRootBranch(new THREE.Vector3(0, 0, 0), ang, 0, mat, 0, branchingProb);
        }
    }

    function createRootBranch(start, angle, depth, mat, parentLen, branchProb) {
        if (depth > 3) return;
        
        let rootLen = THREE.MathUtils.mapLinear(S.age, 1, 120, 0.3, 1.5) / (depth + 1);
        let dir = new THREE.Vector3(Math.sin(angle) * 0.4, -1, Math.cos(angle) * 0.4).normalize();
        
        let mesh = new THREE.Mesh(rootGeo, mat);
        mesh.position.copy(start);
        mesh.lookAt(start.clone().add(dir));
        mesh.rotateX(Math.PI / 2);
        mesh.scale.set(1.0 / (depth + 1), rootLen, 1.0 / (depth + 1));
        rootGroup.add(mesh);

        let end = start.clone().add(dir.multiplyScalar(rootLen));
        
        // Always one main continuation
        createRootBranch(end, angle + (Math.random()-0.5)*0.4, depth + 1, mat, rootLen, branchProb);

        // Conditional branching
        if (Math.random() < branchProb && depth < 2) {
            createRootBranch(end, angle + 1.2, depth + 1, mat, rootLen, branchProb);
            createRootBranch(end, angle - 1.2, depth + 1, mat, rootLen, branchProb);
        }
    }

    // --- Animation ---
    function animate() {
        requestAnimationFrame(animate);
        
        // Wind sway
        let windSpeed = THREE.MathUtils.mapLinear(S.light, 0, 100000, 0.4, 1.2);
        let t = Date.now() * 0.001 * windSpeed;
        plantGroup.rotation.z = Math.sin(t) * 0.01;
        plantGroup.rotation.x = Math.cos(t * 1.3) * 0.005;

        // Ambient light intensity from Light sensor
        let ambientIntensity = THREE.MathUtils.mapLinear(S.light, 0, 100000, 0.2, 0.7);
        ambient.intensity = ambientIntensity;

        ctrl.update();
        ren.render(scene, cam);
    }

    // --- UI Bindings ---
    const bind = (id, k) => document.getElementById(id).addEventListener('input', e => {
        S[k] = parseFloat(e.target.value); buildPlant(); updateUI();
    });
    bind('slider-age', 'age');
    bind('slider-moisture', 'moisture');
    bind('slider-atemp', 'atemp');
    bind('slider-humi', 'humi');
    bind('slider-tds', 'tds');
    bind('slider-light', 'light');
    bind('slider-wtemp', 'wtemp');

    document.getElementById('toggle-roots').addEventListener('click', e => {
        S.roots = !S.roots; e.target.classList.toggle('active'); buildPlant();
    });
    document.getElementById('reset-cam').addEventListener('click', () => {
        cam.position.set(0, 4, 10); ctrl.target.set(0, 2, 0);
    });

    function updateUI() {
        document.getElementById('val-moisture').innerText = S.moisture + "%";
        document.getElementById('val-tds').innerText = S.tds + " ppm";
        document.getElementById('val-light').innerText = (S.light / 1000).toFixed(1) + "k lux";
        document.getElementById('val-env').innerText = S.atemp + "°C / " + S.humi + "%";
        document.getElementById('val-wtemp').innerText = S.wtemp + " °C";
        
        document.getElementById('val-moisture').className = "value " + (S.moisture < 45 ? "alert-low" : "");
        document.getElementById('val-tds').className = "value " + (S.tds < 400 ? "alert-low" : (S.tds > 1500 ? "alert-high" : ""));
        document.getElementById('val-env').className = "value " + (S.atemp > 38 || S.atemp < 15 ? "alert-high" : "");
    }

    window.addEventListener('resize', () => {
        cam.aspect = box.clientWidth / box.clientHeight;
        cam.updateProjectionMatrix();
        ren.setSize(box.clientWidth, box.clientHeight);
    });

    updateUI();
    animate();

    // --- WebSocket Real-time Integration ---
    // Menghubungkan secara dinamis ke server yang menyajikan halaman web ini
    const socket = io();

    socket.on("connect", () => {
        console.log("[WS] Terhubung ke server WebSocket!");
        document.getElementById('stage-display').innerText = 'Live Feed Connected';
    });

    socket.on("disconnect", () => {
        console.log("[WS] Koneksi WebSocket terputus.");
        document.getElementById('stage-display').innerText = 'Feed Offline';
    });

    socket.on("sensorUpdate", (data) => {
        console.log("[WS] Menerima data sensor baru dari server:", data);

        // Perbarui state parameter 3D padi
        S.moisture = data.kelembapan_tanah;
        S.tds = data.tds_nutrisi;
        S.light = data.intensitas_cahaya;
        S.atemp = data.suhu_udara;
        S.humi = data.kelembapan_udara;
        S.wtemp = data.suhu_air;

        // Render ulang tanaman padi & update teks status di sidebar
        buildPlant();
        updateUI();

        // Geser posisi slider secara otomatis di dashboard mengikuti data sensor
        document.getElementById('slider-moisture').value = S.moisture;
        document.getElementById('slider-tds').value = S.tds;
        document.getElementById('slider-light').value = S.light;
        document.getElementById('slider-atemp').value = S.atemp;
        document.getElementById('slider-humi').value = S.humi;
        document.getElementById('slider-wtemp').value = S.wtemp;
    });
    </script>
</body>
</html>
